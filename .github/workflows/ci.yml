name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Build and pack @nestjs/authorization
        run: |
          git clone --depth 1 https://github.com/nestjs/authorization.git ../authorization
          cd ../authorization && npm install && npm run build && npm pack
      - name: Build and pack @nestjs/mail
        run: |
          git clone --depth 1 https://github.com/nestjs/mail.git ../mail
          cd ../mail && npm install && npm run build && npm pack
      - name: Build and pack @nestjs/resilience
        run: |
          git clone --depth 1 https://github.com/nestjs/resilience.git ../resilience
          cd ../resilience && npm install && npm run build && npm pack
      - run: npm install
      - run: npm run build
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node.js line vitest 5 runs on and the current one, against the
        # oldest supported NestJS release (12.0) and the latest 12.x.
        node-version: [22, 24]
        nestjs-version: ['12.0', '12']
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build and pack @nestjs/authorization
        run: |
          git clone --depth 1 https://github.com/nestjs/authorization.git ../authorization
          cd ../authorization && npm install && npm run build && npm pack
      - name: Build and pack @nestjs/mail
        run: |
          git clone --depth 1 https://github.com/nestjs/mail.git ../mail
          cd ../mail && npm install && npm run build && npm pack
      - name: Build and pack @nestjs/resilience
        run: |
          git clone --depth 1 https://github.com/nestjs/resilience.git ../resilience
          cd ../resilience && npm install && npm run build && npm pack
      - name: Install dependencies
        run: npm install
      - name: Install NestJS ${{ matrix.nestjs-version }}
        run: npm install --no-save @nestjs/common@${{ matrix.nestjs-version }} @nestjs/core@${{ matrix.nestjs-version }} @nestjs/testing@${{ matrix.nestjs-version }} @nestjs/platform-express@${{ matrix.nestjs-version }} @nestjs/platform-fastify@${{ matrix.nestjs-version }} @nestjs/microservices@${{ matrix.nestjs-version }} @nestjs/websockets@${{ matrix.nestjs-version }} @nestjs/platform-ws@${{ matrix.nestjs-version }}
      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit
      - name: e2e tests
        run: npm run test:e2e
